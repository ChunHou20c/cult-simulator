server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  # Hashed build assets and content-addressed packs never change.
  location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }
  location /packs/  { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }

  # Always revalidate the shell, service worker and runtime config.
  location = /config.js { add_header Cache-Control "no-cache"; }
  location = /sw.js     { add_header Cache-Control "no-cache"; }
  location = /index.html { add_header Cache-Control "no-cache"; }
  # nginx's stock mime.types has no webmanifest entry. A server-level types {}
  # block would replace the whole table (everything else became
  # application/octet-stream), so set the type for this one file only.
  location = /manifest.webmanifest { default_type application/manifest+json; add_header Cache-Control "no-cache"; }

  location / { try_files $uri $uri/ /index.html; add_header Cache-Control "no-cache"; }
}
